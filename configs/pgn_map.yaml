# J1939 / DroneCAN / ARINC 825 Telemetry Mapping Configuration
# Explicit PGN / SPN layout for Rotax 914 F / 915 iS ECU & Sensor Node Telemetry
protocol: "CAN 2.0B / J1939 Extended (29-bit CAN ID)"
baud_rate_bps: 500000
endianness: "little_endian"

messages:
  - name: "ENGINE_DYNAMICS"
    can_id: 0x18FEE000
    pgn: 0xFEE0
    rate_hz: 50
    dlc: 8
    signals:
      - name: "engine_speed_rpm"
        spn: 190
        start_bit: 0
        bit_length: 16
        is_signed: false
        scale: 0.125
        offset: 0.0
        unit: "rpm"
        min: 0.0
        max: 8000.0
      - name: "manifold_air_pressure_kpa"
        spn: 102
        start_bit: 16
        bit_length: 16
        is_signed: false
        scale: 0.01
        offset: 0.0
        unit: "kPa"
        min: 20.0
        max: 250.0
      - name: "throttle_position_pct"
        spn: 91
        start_bit: 32
        bit_length: 8
        is_signed: false
        scale: 0.4
        offset: 0.0
        unit: "%"
        min: 0.0
        max: 100.0
      - name: "bus_voltage_v"
        spn: 158
        start_bit: 40
        bit_length: 8
        is_signed: false
        scale: 0.2
        offset: 0.0
        unit: "V"
        min: 0.0
        max: 50.0
      - name: "engine_status_flags"
        spn: 523
        start_bit: 48
        bit_length: 16
        is_signed: false
        scale: 1.0
        offset: 0.0
        unit: "bitfield"
        min: 0
        max: 65535

  - name: "THERMAL_MATRIX_1_CHT"
    can_id: 0x18FEE100
    pgn: 0xFEE1
    rate_hz: 10
    dlc: 8
    signals:
      - name: "cht_cyl1_deg_c"
        spn: 1137
        start_bit: 0
        bit_length: 16
        is_signed: false
        scale: 0.1
        offset: 0.0
        unit: "degC"
        min: -40.0
        max: 250.0
      - name: "cht_cyl2_deg_c"
        spn: 1138
        start_bit: 16
        bit_length: 16
        is_signed: false
        scale: 0.1
        offset: 0.0
        unit: "degC"
        min: -40.0
        max: 250.0
      - name: "cht_cyl3_deg_c"
        spn: 1139
        start_bit: 32
        bit_length: 16
        is_signed: false
        scale: 0.1
        offset: 0.0
        unit: "degC"
        min: -40.0
        max: 250.0
      - name: "cht_cyl4_deg_c"
        spn: 1140
        start_bit: 48
        bit_length: 16
        is_signed: false
        scale: 0.1
        offset: 0.0
        unit: "degC"
        min: -40.0
        max: 250.0

  - name: "THERMAL_MATRIX_2_EGT"
    can_id: 0x18FEE200
    pgn: 0xFEE2
    rate_hz: 10
    dlc: 8
    signals:
      - name: "egt_cyl1_deg_c"
        spn: 1141
        start_bit: 0
        bit_length: 16
        is_signed: false
        scale: 0.1
        offset: 0.0
        unit: "degC"
        min: 0.0
        max: 1200.0
      - name: "egt_cyl2_deg_c"
        spn: 1142
        start_bit: 16
        bit_length: 16
        is_signed: false
        scale: 0.1
        offset: 0.0
        unit: "degC"
        min: 0.0
        max: 1200.0
      - name: "egt_cyl3_deg_c"
        spn: 1143
        start_bit: 32
        bit_length: 16
        is_signed: false
        scale: 0.1
        offset: 0.0
        unit: "degC"
        min: 0.0
        max: 1200.0
      - name: "egt_cyl4_deg_c"
        spn: 1144
        start_bit: 48
        bit_length: 16
        is_signed: false
        scale: 0.1
        offset: 0.0
        unit: "degC"
        min: 0.0
        max: 1200.0

  - name: "FLUIDS_AND_LUBE"
    can_id: 0x18FEE300
    pgn: 0xFEE3
    rate_hz: 10
    dlc: 8
    signals:
      - name: "oil_pressure_bar"
        spn: 100
        start_bit: 0
        bit_length: 16
        is_signed: false
        scale: 0.001
        offset: 0.0
        unit: "bar"
        min: 0.0
        max: 10.0
      - name: "oil_temperature_deg_c"
        spn: 175
        start_bit: 16
        bit_length: 16
        is_signed: false
        scale: 0.1
        offset: -40.0
        unit: "degC"
        min: -40.0
        max: 180.0
      - name: "fuel_flow_rate_lph"
        spn: 183
        start_bit: 32
        bit_length: 16
        is_signed: false
        scale: 0.01
        offset: 0.0
        unit: "L/h"
        min: 0.0
        max: 120.0
      - name: "fuel_pressure_bar"
        spn: 94
        start_bit: 48
        bit_length: 16
        is_signed: false
        scale: 0.001
        offset: 0.0
        unit: "bar"
        min: 0.0
        max: 10.0

  - name: "VIBRATION_AND_BLOWBY"
    can_id: 0x18FEE400
    pgn: 0xFEE4
    rate_hz: 50
    dlc: 8
    signals:
      - name: "rms_vibration_g"
        spn: 1201
        start_bit: 0
        bit_length: 16
        is_signed: false
        scale: 0.001
        offset: 0.0
        unit: "g"
        min: 0.0
        max: 20.0
      - name: "peak_knock_intensity_bar"
        spn: 1202
        start_bit: 16
        bit_length: 16
        is_signed: false
        scale: 0.001
        offset: 0.0
        unit: "bar"
        min: 0.0
        max: 30.0
      - name: "crankcase_pressure_mbar"
        spn: 101
        start_bit: 32
        bit_length: 16
        is_signed: false
        scale: 0.01
        offset: -50.0
        unit: "mbar"
        min: -50.0
        max: 150.0
      - name: "coolant_temperature_deg_c"
        spn: 110
        start_bit: 48
        bit_length: 16
        is_signed: false
        scale: 0.1
        offset: -40.0
        unit: "degC"
        min: -40.0
        max: 150.0
