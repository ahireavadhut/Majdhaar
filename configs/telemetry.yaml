telemetry:
  interface_type: "socketcan" # or "virtual", "replay_candump", "serial"
  channel: "can0"
  bitrate: 500000
  buffer_size: 2048
  timeout_ms: 100
  sync_frequency_hz: 50
  raw_archive_directory: "data/raw"
  decoded_archive_directory: "data/decoded"
  metadata_archive_directory: "data/metadata"
